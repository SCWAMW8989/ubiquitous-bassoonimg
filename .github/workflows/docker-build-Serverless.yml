name: Docker Build Serverless

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile.qwen-image-edit-serverless-v1_4.dockerfile"
      - "extra_model_paths.yaml"
      - "serverless_entrypoint.sh"
      - ".github/workflows/docker-build-Serverless.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Free disk space (base image + baked models need about 60 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force
          df -h /

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: List files
        run: find . -iname "*qwen-image-edit-serverless*" -o -name "serverless_entrypoint.sh" -o -name "extra_model_paths.yaml"

      - name: Syntax check entrypoint
        run: bash -n serverless_entrypoint.sh

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build and push
        run: |
          docker build -f Dockerfile.qwen-image-edit-serverless-v1_4.dockerfile \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/qwen-image-edit:serverless-v1_4 .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/qwen-image-edit:serverless-v1_4
